name: Dotfiles CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  # TruffleHog scans a base..head DIFF on push/PR events and the FULL
  # history only on workflow_dispatch/schedule (see security-scan). This
  # weekly run is what makes its verified-credential scan eventually
  # cover every commit, including anything merged before it was added.
  schedule:
    - cron: '17 4 * * 1'

# Least-privilege GITHUB_TOKEN: nothing in this pipeline writes to the repo
permissions:
  contents: read

jobs:
  lint-all:
    name: Comprehensive Lint Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck libxml2-utils
          pip install yamllint
          npm install -g markdownlint-cli@0.49.1

      - name: Lint shell scripts (shebang-detected, includes extensionless)
        run: |
          echo "=== bash -n + ShellCheck over tracked bash/sh scripts ==="
          exit_code=0
          while IFS= read -r script; do
            if head -1 "$script" 2>/dev/null | \
               grep -qE '^#!/(usr/(local/)?)?bin/(env +)?(bash|sh)\b'; then
              echo "Checking: $script"
              bash -n "$script" || exit_code=1
              shellcheck -S warning "$script" || exit_code=1
            fi
          done < <(git ls-files)
          exit $exit_code

      - name: Lint YAML files
        run: |
          echo "=== YAML Lint ==="
          yamllint -d relaxed -f colored .

      # Both pinned: go install verifies via the Go checksum DB, pip via PyPI.
      # actionlint = semantic lint (incl. shellcheck on run: scripts),
      # zizmor = security audit (needs GH_TOKEN for online audits).
      - name: Lint GitHub Actions workflows (actionlint + zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          pip install zizmor==1.29.0
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
          zizmor --no-progress .github/workflows/

      - name: Lint Markdown files (blocking)
        run: |
          echo "=== Markdown Lint (tracked files, must pass) ==="
          git ls-files -z '*.md' | xargs -0 markdownlint

      - name: Validate plist templates (XML)
        run: |
          echo "=== Plist XML validation ==="
          while IFS= read -r plist; do
            echo "Checking: $plist"
            sed "s|{{HOME}}|/home/runner|g; s|{{env.HOME}}|/home/runner|g" \
              "$plist" | xmllint --noout -
          done < <(git ls-files '*plist*')

      - name: Universal file type validation
        run: |
          echo "=== Enhanced File Type Validation ==="

          # Install additional tools
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck
          pip install tomli

          # JSON validation
          echo "🔍 JSON Files:"
          find . -name "*.json" -type f ! -path "./.git/*" | \
            while read -r file; do
            echo "  Validating: $file"
            python -m json.tool "$file" >/dev/null
          done

          # TOML validation
          echo "🔍 TOML Files:"
          find . -name "*.toml" -type f ! -path "./.git/*" | \
            while read -r file; do
            echo "  Validating: $file"
            python -c "import tomli; tomli.load(open('$file', 'rb'))"
          done

          # Lua validation
          echo "🔍 Lua Files:"
          lua_pattern="*.lua"
          exclude_git="./.git/*"
          exclude_examples="*example*"
          # Exclude third-party plugin/flavor files managed by ya pkg
          exclude_third_party_plugins="./\.config/yazi/plugins/git.yazi/*"
          exclude_flavors="./\.config/yazi/flavors/*"
          if find . -name "$lua_pattern" -type f \
            ! -path "$exclude_git" ! -name "$exclude_examples" \
            ! -path "$exclude_third_party_plugins" \
            ! -path "$exclude_flavors" | grep -q .; then
            find . -name "$lua_pattern" -type f \
              ! -path "$exclude_git" ! -name "$exclude_examples" \
              ! -path "$exclude_third_party_plugins" \
              ! -path "$exclude_flavors" -print0 | \
              while IFS= read -r -d '' file; do
              echo "  Validating: $file"
              # Use Neovim-specific globals for config files
              if [[ "$file" == *"nvim"* ]]; then
                luacheck --globals vim require --std luajit "$file"
              elif [[ "$file" == *"yazi"* ]]; then
                luacheck --globals Status Linemode ya ui th fs Url Command Err ps rt cx --std luajit "$file"
              else
                luacheck "$file"
              fi
            done
          else
            echo "  No Lua files found (excluding examples)"
          fi

          # Brewfile validation
          if [ -f "Brewfile" ]; then
            echo "🔍 Brewfile:"
            grep -E '^(tap|brew|cask)\s+' Brewfile >/dev/null
            duplicates=$(grep -E '^(brew|cask)\s+' Brewfile | \
              sort | uniq -d | wc -l)
            [ "$duplicates" -eq 0 ]
          fi

      - name: Check file permissions
        run: |
          echo "=== File Permissions Check ==="
          # Check that shell scripts are executable
          while IFS= read -r script; do
            if [ ! -x "$script" ]; then
              echo "Warning: $script is not executable"
            fi
          done < <(find . -name "*.sh" -type f)

  documentation:
    name: Documentation Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check README exists
        run: |
          if [ ! -f README.md ]; then
            echo "ERROR: README.md not found"
            exit 1
          fi

      - name: Check for broken links in README
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          use-quiet-mode: 'yes'
          check-modified-files-only: 'yes'
        continue-on-error: true

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # REQUIRED by both secret scanners below. checkout defaults to
          # fetch-depth 1, which silently reduces a "full history" scan
          # to a single commit while still reporting success — the same
          # false-pass class as running gitleaks outside a repo (it says
          # "0 commits scanned ... no leaks found"). Cheap here: the repo
          # is ~1.6 MB over ~300 commits, scanned in well under a second.
          fetch-depth: 0

      # Trivy stays advisory: filesystem CVE scanning is noisy for a
      # dotfiles repo. Pinned to a release SHA (was @master — a mutable
      # ref that would execute whatever upstream HEAD contains).
      - name: Run Trivy security scanner (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      # BLOCKING, but scoped to a DIFF, not full history — verified by
      # reading action.yml at the pinned SHA: with only `path` set it
      # derives BASE/HEAD from the event (push -> before..after,
      # pull_request -> base.sha..head.sha) and scans everything only on
      # workflow_dispatch/schedule. That is why this job also carries a
      # schedule trigger, and why gitleaks below is the true
      # full-history net. fetch-depth: 0 stays REQUIRED either way —
      # those base shas cannot resolve in a depth-1 clone.
      # --results=verified: only credentials TruffleHog confirmed live
      # against the provider fail the build (no regex noise).
      # version: pins the scanner itself. The action SHA does not — it
      # runs `docker run ghcr.io/trufflesecurity/trufflehog:<version>`
      # and that input defaults to the MUTABLE `latest` tag, the same
      # class of mutable ref that got Trivy's @master pinned earlier.
      # NOTE the tag has NO `v` prefix: the git tag is v3.96.0 but the
      # GHCR tag is 3.96.0. `v3.96.0` is a 404 and docker run exits 125
      # (image pull failure), which reads as a scan failure, not a typo.
      - name: Check for secrets (blocking)
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          version: 3.96.0
          extra_args: --results=verified

      # Second, complementary net. --results=verified above means
      # TruffleHog only fails on credentials it could confirm LIVE
      # against the provider: a private key block, a revoked-but-real
      # token, a password, or any provider it cannot verify all pass it
      # silently. gitleaks is regex/entropy based and catches those.
      # It is also the same engine the yadm pre_commit hook runs, and
      # that hook is bypassable (--no-verify, or a raw GIT_DIR commit),
      # so CI holds the authoritative copy of the gate. go install is
      # the pattern already used for actionlint (verified through the
      # Go checksum database); ubuntu-latest ships Go preinstalled.
      - name: Check for secrets — gitleaks (blocking, full history)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact .

  macos-integration:
    name: macOS Integration + Test Suite
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache uv tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/uv
            ~/.local/bin
          key: uv-tools-${{ runner.os }}-beautysh-v1

      - name: Install validation tools
        run: |
          brew install uv zellij || true
          uv tool install beautysh --with setuptools || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate zsh configuration
        run: |
          echo "=== zsh native syntax check ==="
          zsh -n .zshrc
          echo "=== beautysh format check ==="
          if command -v beautysh >/dev/null 2>&1; then
            PYTHONWARNINGS="ignore" beautysh --check .zshrc
          else
            echo "beautysh unavailable; skipping format check"
          fi

      - name: Validate Zellij KDL configs
        run: |
          echo "=== zellij setup --check ==="
          zellij --config-dir "$GITHUB_WORKSPACE/.config/zellij" setup --check

      - name: Validate LaunchAgent plist template (plutil)
        run: |
          while IFS= read -r template; do
            echo "Checking: $template"
            sed "s|{{HOME}}|$HOME|g; s|{{env.HOME}}|$HOME|g" \
              "$template" > /tmp/ci-test.plist
            plutil -lint /tmp/ci-test.plist
            rm -f /tmp/ci-test.plist
          done < <(git ls-files 'Library/LaunchAgents/*plist*')

      - name: Bootstrap script checks
        run: |
          echo "=== bootstrap syntax ==="
          bash -n .config/yadm/bootstrap
          echo "=== bootstrap test suite (mocked, no real installs) ==="
          HOME="$GITHUB_WORKSPACE" bash test-bootstrap.sh

      - name: Static-check maintenance scripts (never executed in CI)
        run: |
          # The old pipeline 'source'd daily-maintenance.sh here, which ran
          # real brew commands on the runner. Static checks only now.
          for s in daily-maintenance.sh daily-maintenance-control.sh \
                   install-daily-maintenance.sh uninstall-daily-maintenance.sh; do
            echo "bash -n $s"
            bash -n "$s"
          done
          echo "=== regression guard: required functions exist ==="
          grep -qE '^run_command\(\)' daily-maintenance.sh
          grep -qE '^run_with_timeout\(\)' daily-maintenance.sh

      - name: Run dotfiles test suite
        run: |
          export HOME="$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:$PATH"
          bash test-dotfiles.sh

  summary:
    name: CI Summary
    needs: [lint-all, documentation, security-scan, macos-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## CI Pipeline Summary"
          echo "All validation checks completed."
          echo "Check individual job results above for details."
