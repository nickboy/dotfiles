set -g default-terminal "tmux-256color"
# Truecolor via terminal-features (tmux 3.2+ style, consistent with the
# extkeys declaration below; terminal-overrides is kept only for the
# raw undercurl capability strings which have no feature equivalent here)
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',xterm-ghostty:RGB'

# Undercurl support (colored wavy underlines for Neovim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# OSC52 clipboard passthrough
set -g set-clipboard on

# DCS passthrough for image protocols and shell integration
set -g allow-passthrough all

# Forward the tmux WINDOW name (e.g. the "🤖 project" set for a Claude pane)
# to the outer terminal's tab title — locally and over SSH. Use window_name,
# not the pane title (#T): Claude Code rewrites the pane title with its
# spinner, which would make the tab flicker.
set -g set-titles on
set -g set-titles-string "#{window_name}"

# Pass modifier keys (Shift+Enter, etc.) to applications inside tmux
set -g extended-keys on
set -as terminal-features ',xterm-ghostty:extkeys'

# Tmux 3.6: scrollbars visible only in copy-mode
set -g pane-scrollbars modal

# Allow Ghostty transparency to pass through tmux panes
set -g window-style "bg=default"
set -g window-active-style "bg=default"


unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Uppercase reload aliases herdr's prefix+shift+r; lowercase r is tmux legacy
bind R source-file ~/.tmux.conf \; display-message "Config reloaded"


set -g prefix C-a

bind C-a send-prefix

unbind %
bind \\ split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# New windows also use current path
bind c new-window -c "#{pane_current_path}"

set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Scrollback: default is only 2000 lines — out of proportion with
# Ghostty's 25MB. 50k lines keeps long build/agent logs reachable.
set -g history-limit 50000

# Copy mode (prefix+[): pin vi keys explicitly — the vi default here is
# an accident of EDITOR=nvim, and a machine/context without that env
# silently falls back to emacs. v/C-v add vim muscle memory on top
# (stock vi mode only has Space/Enter); y stays with tmux-yank.
# Same prefix+[ entry and vi motions as herdr's built-in copy mode.
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
# ( / ): hop between shell prompts (OSC 133 marks from Ghostty's zsh
# integration — verified to survive into tmux panes)
bind -T copy-mode-vi ( send -X previous-prompt
bind -T copy-mode-vi ) send -X next-prompt

# prefix+P: copy the previous shell command's complete output. Shell
# commands only — Claude's TUI emits no OSC 133 marks (probed), so for
# agent replies use prefix+O below. The cursor-up/end-of-line step trims
# the next prompt's first character that the naive chain would grab.
bind P copy-mode \; send -X previous-prompt -o \; send -X begin-selection \; send -X next-prompt \; send -X cursor-up \; send -X end-of-line \; send -X copy-pipe-and-cancel pbcopy \; display "copied: last command output"

# prefix+O (agent Output; Y is tmux-yank's): copy Claude's latest reply.
#
# This types Claude Code's own `/copy` into the pane rather than reading
# the transcript ourselves. `/copy` ships with Claude Code (verified in
# 2.1.220), emits OSC 52, and — decisively — runs INSIDE the conversation
# the pane is displaying, so it needs no answer to "which session is this
# pane running", which is the question that made the do-it-ourselves
# version large. It also reaches the client's clipboard over a remote
# attach, which a server-side `pbcopy` cannot.
#
# Requires the pane to be at an idle Claude prompt. To copy while a turn
# is still streaming, use `ccl` in a shell instead.
bind O send-keys '/copy' Enter

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable resize (hold prefix, tap H/J/K/L repeatedly)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window swapping
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Popups — same muscle memory as herdr (prefix+alt+g / prefix+t).
# bind t shadows the default clock-mode, which nobody will miss.
bind M-g display-popup -E -w 85% -h 85% "lazygit"
bind t display-popup -E -w 80% -h 75%


bind "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# prefix+f = open project, aligned with herdr's sessionizer; T kept as legacy
bind f run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# prefix+e = review changes, aligned with herdr's reviewr
bind e display-popup -E -w 90% -h 90% "lazygit"

set -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'

# Catppuccin theme configuration
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_background "none"
set -g status-left-length 30
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}"
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-thumbs: prefix+F to highlight URLs/hashes/paths for keyboard copy
# (no mouse selection required; great for Claude Code output)
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key F
set -g @thumbs-command 'tmux set-buffer -w -- {}'
set -g @thumbs-upcase-command 'tmux set-buffer -w -- {} && open {}'

# Which-key popup: press prefix+Space to see available shortcuts
set -g @plugin 'Nucc/tmux-which-key'
set -g @which-key-trigger '?'
set -g @which-key-popup-bg 'default'
set -g @which-key-popup-fg '#6c7086'

# tmux-claude-session-manager: prefix+y launches/attaches a Claude session for
# the current dir; prefix+u opens an fzf picker of live Claude sessions with a
# live preview and working/waiting/idle status. v1.1.0+: status is read live
# from `claude agents` — the old state.sh settings.json hooks are gone and
# must never be re-added.
set -g @plugin 'craftzdog/tmux-claude-session-manager'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Toggle outer/inner tmux for nested sessions
# F12 disables outer tmux prefix, all keys pass to inner tmux
# F12 again re-enables outer tmux
# Status bar color changes to indicate which tmux is active
bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    set status-style "fg=colour245,bg=colour238" \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-style \;\
    refresh-client -S

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Override Catppuccin theme popup colors for Ghostty transparency
set -g popup-style "bg=default"
set -g popup-border-style "fg=#6c7086"
